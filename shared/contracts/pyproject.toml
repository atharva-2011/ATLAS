[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-contracts"
version = "0.1.0"
description = "ATLAS Shared Service Contracts and DTOs"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
