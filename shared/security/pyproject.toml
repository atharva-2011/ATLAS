[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-security"
version = "0.1.0"
description = "ATLAS Shared Security Interfaces and Boundary Helpers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
