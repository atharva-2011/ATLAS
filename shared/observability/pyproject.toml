[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-observability"
version = "0.1.0"
description = "ATLAS Shared Observability, Logging, and Correlation Middleware"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.40.0",
]

[tool.setuptools.packages.find]
where = ["src"]
