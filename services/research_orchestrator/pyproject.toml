[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-research-orchestrator"
version = "0.1.0"
description = "ATLAS Research Orchestrator Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "langgraph>=1.2.0",
    "atlas-contracts",
    "atlas-observability",
    "atlas-common",
    "atlas-security",
]

[tool.setuptools.packages.find]
where = ["src"]
