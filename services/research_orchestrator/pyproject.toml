[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-research-orchestrator"
version = "0.1.0"
description = "ATLAS Research Orchestrator Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "atlas-contracts",
    "atlas-observability",
    "atlas-common",
]

[tool.setuptools.packages.find]
where = ["src"]
